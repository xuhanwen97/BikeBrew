<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike &amp; Brews Avatars</title>
<style>
  :root { --bg: #e9edf0; --surface: #fff; --ink: #16191d; --muted: #5b6570; --amber: #c66f12; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121519; --surface: #1b2026; --ink: #eef1f3; --muted: #9aa5af; --amber: #f0a040; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0; font: 400 34px/1.1 Georgia, serif; }
  p { color: var(--muted); max-width: 70ch; }
  code { background: var(--surface); padding: 1px 6px; border-radius: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
  figure { margin: 0; background: var(--surface); border-radius: 14px; padding: 12px; text-align: center; }
  img { width: 100%; max-width: 130px; height: auto; }
  figcaption strong { display: block; text-transform: capitalize; }
  figcaption span { display: block; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Bike &amp; Brews avatars</h1>
  <p>Every animal the podium can draw (24, plus Pac-Man for riders without one). Type any of these names, or the "also" spellings, in the Animal column of the Rider Names sheet. Each drawing is saved as <code>avatars/svg/&lt;animal&gt;.svg</code>; the drawing code lives in <code>avatars/avatars.js</code>.</p>
  <div class="grid">
    <figure>
      <img src="svg/bear.svg" alt="bear" width="130" height="132">
      <figcaption><strong>bear</strong><span>also: grizzly, polar</span></figcaption>
    </figure>
    <figure>
      <img src="svg/cat.svg" alt="cat" width="130" height="132">
      <figcaption><strong>cat</strong><span>also: kitten, kitty</span></figcaption>
    </figure>
    <figure>
      <img src="svg/cow.svg" alt="cow" width="130" height="132">
      <figcaption><strong>cow</strong><span>also: bull, cattle</span></figcaption>
    </figure>
    <figure>
      <img src="svg/dog.svg" alt="dog" width="130" height="132">
      <figcaption><strong>dog</strong><span>also: corgi, doggo, lab, labrador, pug, pup, puppy, retriever</span></figcaption>
    </figure>
    <figure>
      <img src="svg/duck.svg" alt="duck" width="130" height="132">
      <figcaption><strong>duck</strong><span>also: chick, goose</span></figcaption>

    <figure>

    <figure>

    <figure>

    </figure>
    <figure>

    <figure>

    <figure>
